name: ViralGains
description: >-
  ViralGains is an advertising technology platform that collects consumer
  feedback directly within digital ad units as zero-party data, then combines
  that real-time, consented consumer input with its VoiceAlike AI to build
  higher-quality audiences and deliver more relevant, privacy-respecting
  advertising for brands and agencies. The platform spans zero-party data
  collection, brand lift measurement, and a dedicated health and pharma
  offering (VG Health). ViralGains was surfaced as a portfolio company of
  500 Global and added to the API Evangelist network. As of this enrichment
  pass the company publishes a marketing and product website but no public
  developer program, API documentation, or machine-readable API surface.
